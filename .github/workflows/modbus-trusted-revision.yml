name: Modbus Trusted Revision

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  trusted-revision:
    name: Modbus Trusted Revision
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted validator from PR base
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Project-Helianthus/helianthus-docs-ebus
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          clean: true
          persist-credentials: false

      - name: Checkout trusted prior state
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Project-Helianthus/helianthus-docs-ebus
          ref: ${{ github.event.pull_request.base.sha }}
          path: prior
          clean: true
          persist-credentials: false

      - name: Checkout untrusted PR head as data
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: current
          clean: true
          persist-credentials: false

      - name: Verify immutable checkout identities
        env:
          TRUSTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          UNTRUSTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git -C trusted rev-parse HEAD)" = "${TRUSTED_BASE_SHA}"
          test "$(git -C prior rev-parse HEAD)" = "${TRUSTED_BASE_SHA}"
          test "$(git -C current rev-parse HEAD)" = "${UNTRUSTED_HEAD_SHA}"

      - name: Validate Modbus revision transition with base code
        run: |
          python3 trusted/scripts/validate_modbus_revision_transition.py \
            --prior-root prior \
            --current-root current
