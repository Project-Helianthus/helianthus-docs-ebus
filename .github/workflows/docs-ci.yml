name: Docs CI

on:
  pull_request:
    paths:
      - "**/*.md"
      - "**/*.py"
      - "**/*.json"
      - "docs/platform/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/docs-ci.yml"
      - ".github/workflows/modbus-trusted-revision.yml"
      - ".github/workflows/modbus-trusted-revision-pr.yml"
      - "requirements-ci.txt"
      - "Makefile"
      - "ruff.toml"
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - "**/*.py"
      - "**/*.json"
      - "docs/platform/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/docs-ci.yml"
      - ".github/workflows/modbus-trusted-revision.yml"
      - ".github/workflows/modbus-trusted-revision-pr.yml"
      - "requirements-ci.txt"
      - "Makefile"
      - "ruff.toml"
  # Nightly full run of the docs gate, including the runtime-control contract
  # tests that pull requests skip when none of their inputs changed.
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

# One group per pull request, one for main pushes, and separate groups for the
# nightly schedule and manual dispatches. A newer push to a pull request, or a
# newer main push, cancels the run in progress, so only the newest main commit
# gets a full run; a push never cancels the nightly run or a dispatch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  markdown-checks:
    name: Docs Checks
    # fork pull requests never run on the persistent runners
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || 'synology' }}
    # The local docs CI exceeds 90 minutes on the shared self-hosted runner when
    # other jobs run beside it; 150 minutes keeps the job from being cancelled
    # a few steps before the end (issue #733 tracks the runtime itself).
    timeout-minutes: 150
    steps:
      - name: Checkout PR head
        if: github.event_name == 'pull_request'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: checkouts/docs-ebus
          clean: true
          persist-credentials: false

      - name: Checkout push commit
        if: github.event_name != 'pull_request'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: checkouts/docs-ebus
          clean: true
          persist-credentials: false

      - name: Checkout trusted PR base manifest
        if: github.event_name == 'pull_request'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Project-Helianthus/helianthus-docs-ebus
          ref: ${{ github.event.pull_request.base.sha }}
          path: checkouts/docs-ebus-base
          clean: true
          persist-credentials: false

      - name: Checkout helianthus-docs
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Project-Helianthus/helianthus-docs
          ref: ff8fccc7d5fbcbfe1e156fce302549d04a2f6228
          path: checkouts/docs
          clean: true
          persist-credentials: false
      - name: Checkout helianthus-docs-eebus
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Project-Helianthus/helianthus-docs-eebus
          ref: 0b48b84430d4ff4a5cdf9740dc402af544820f8f
          path: checkouts/docs-eebus
          clean: true
          persist-credentials: false
      - name: Checkout pinned helianthus-docs-ebus runtime page
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Project-Helianthus/helianthus-docs-ebus
          ref: 977614c944cd685bef75b5b12148e1110ed7653a
          path: checkouts/docs-ebus-pin
          clean: true
          persist-credentials: false
      - name: Checkout M6.25 provenance sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Project-Helianthus/helianthus-docs-eebus
          ref: cedf238e34f879815ba773e9cd76b2b31c2822a3
          path: checkouts/m625-docs-eebus
          clean: true
          persist-credentials: false

      - name: Checkout M6.25 execution-plan source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Project-Helianthus/helianthus-execution-plans
          ref: fb384ab57d79f0020c54d2c66416e8a7666f0ceb
          path: checkouts/m625-execution-plans
          clean: true
          persist-credentials: false

      - name: Checkout exact M6.25 trusted validator base
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Project-Helianthus/helianthus-docs-ebus
          ref: 8215201a4274db5310ee672619ba2f1d27b99bec
          path: checkouts/m625-trusted-base
          clean: true
          persist-credentials: false

      - name: Prepare hash-locked pip bootstrap
        run: |
          set -euo pipefail
          bootstrap_dir="${RUNNER_TEMP}/helianthus-pip-bootstrap"
          wheel="${bootstrap_dir}/pip-25.0.1-py3-none-any.whl"
          mkdir -p "${bootstrap_dir}"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            --output "${wheel}.part" \
            https://files.pythonhosted.org/packages/c9/bc/b7db44f5f39f9d0494071bddae6880eb645970366d0a200022a1a93d57f5/pip-25.0.1-py3-none-any.whl
          printf '%s  %s\n' \
            c46efd13b6aa8279f33f2864459c8ce587ea6a1a59ee20de055868d8f7688f7f \
            "${wheel}.part" | sha256sum --check --strict
          mv "${wheel}.part" "${wheel}"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        env:
          PIP_FIND_LINKS: ${{ runner.temp }}/helianthus-pip-bootstrap
          PIP_NO_INDEX: "1"
        with:
          python-version: "3.12.10"

      - name: Create job-local virtualenv with hash-locked pip
        run: |
          set -euo pipefail
          wheel="${RUNNER_TEMP}/helianthus-pip-bootstrap/pip-25.0.1-py3-none-any.whl"
          rm -rf "${RUNNER_TEMP}/venv"
          python -m venv --without-pip "${RUNNER_TEMP}/venv"
          "${RUNNER_TEMP}/venv/bin/python" "${wheel}/pip" install \
            --no-index --no-deps --disable-pip-version-check "${wheel}"
          echo "${RUNNER_TEMP}/venv/bin" >> "${GITHUB_PATH}"

      - name: Verify pinned Python and pip
        run: |
          python - <<'PY'
          import importlib.metadata
          import sys

          if sys.version_info[:3] != (3, 12, 10):
              raise SystemExit("unexpected Python bootstrap version")
          if importlib.metadata.version("pip") != "25.0.1":
              raise SystemExit("unexpected pip bootstrap version")
          PY

      - name: Install test dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-deps \
            --no-build-isolation --require-hashes \
            -r checkouts/docs-ebus/requirements-ci.txt
          python -m pip check

      # Prior revisions come from the trusted base workflow. The candidate pins
      # above stay on the head. A pull request whose base has no companion
      # checkout uses that base tree for the missing owners.
      - name: Resolve prior owner revisions
        id: prior_owners
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git -C checkouts/docs rev-parse HEAD)" = "ff8fccc7d5fbcbfe1e156fce302549d04a2f6228"
          test "$(git -C checkouts/docs-eebus rev-parse HEAD)" = "0b48b84430d4ff4a5cdf9740dc402af544820f8f"
          test "$(git -C checkouts/docs-ebus-pin rev-parse HEAD)" = "977614c944cd685bef75b5b12148e1110ed7653a"
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            test "$(git -C checkouts/docs-ebus rev-parse HEAD)" = "${PR_HEAD_SHA}"
            prior_workflow="checkouts/docs-ebus-base/.github/workflows/docs-ci.yml"
          else
            test "$(git -C checkouts/docs-ebus rev-parse HEAD)" = "${PUSH_SHA}"
            prior_workflow="checkouts/docs-ebus/.github/workflows/docs-ci.yml"
          fi
          # This program is the prior-owner resolver. Docs Checks runs it
          # from this step, not from a test module.
          cat > "${RUNNER_TEMP}/prior_owner_pins.py" <<'PRIOR_OWNER_PINS'
          """Prior owner revisions recorded by the trusted base workflow.

          Docs CI runs this program. Candidate checkouts keep the pins in the head
          workflow. A pull request's prior checkouts use the revisions that workflow
          recorded at the trusted base. On the first split that base has no companion
          checkout, so the eeBUS prior is its recorded docs_eebus_ref and the other
          owners stay empty for the pre-split tree. A nightly or push run reads the
          candidate workflow, which is the same-head pair.
          """

          from __future__ import annotations

          import argparse
          import re
          import subprocess
          import sys
          from pathlib import Path

          SHA = re.compile(r"^[0-9a-f]{40}$")
          CHECKOUT_REFS = {
              "checkouts/docs": "docs_prior_ref",
              "checkouts/docs-eebus": "docs_eebus_prior_ref",
              "checkouts/docs-ebus-pin": "docs_ebus_pin_prior_ref",
          }
          OUTPUT_KEYS = (
              "docs_prior_ref",
              "docs_eebus_prior_ref",
              "docs_ebus_pin_prior_ref",
          )
          PRIOR_CHECKOUTS = {
              "docs_prior_ref": "checkouts/docs-prior",
              "docs_eebus_prior_ref": "checkouts/docs-eebus-prior",
              "docs_ebus_pin_prior_ref": "checkouts/docs-ebus-pin-prior",
          }
          RUNTIME_RELATIVE_PATHS = (
              "api/mcp.md",
              "api/driver-runtime-v1.md",
              "api/portal.md",
              "architecture/runtime-driver-lifecycle.md",
              "architecture/runtime-state.md",
              "architecture/runtime-control-reset-durability.md",
              "docs/platform/driver-runtime-manager-v1.md",
              "scripts/check_runtime_control_contract.py",
              "scripts/runtime_control_contract.json",
              "tests/test_runtime_control_contract.py",
              "scripts/ci_local.sh",
          )
          PIN_RELATIVE_PATHS = ("api/modbus-v1-addon-runtime.md",)

          def recorded_prior_refs(workflow_text: str) -> dict[str, str]:
              """Return prior refs from checkout pins, then the pre-split eeBUS input."""
              refs = {key: "" for key in OUTPUT_KEYS}
              pending: dict[str, str] = {}
              in_with = False

              def consume() -> None:
                  path = pending.get("path", "")
                  ref = pending.get("ref", "")
                  output = CHECKOUT_REFS.get(path)
                  if output and SHA.fullmatch(ref):
                      refs[output] = ref

              for line in workflow_text.splitlines():
                  if re.match(r"^\s*- (?:name|uses):", line):
                      consume()
                      pending = {}
                      in_with = False
                      continue
                  if re.match(r"^\s+with:\s*$", line):
                      in_with = True
                      continue
                  if not in_with:
                      continue
                  match = re.match(r"^\s+(repository|ref|path):\s+(\S+)\s*$", line)
                  if match:
                      pending[match.group(1)] = match.group(2)
              consume()
              if not refs["docs_eebus_prior_ref"]:
                  legacy = re.search(r"(?m)^\s*docs_eebus_ref:\s+([0-9a-f]{40})\s*$", workflow_text)
                  if legacy:
                      refs["docs_eebus_prior_ref"] = legacy.group(1)
              return refs


          def verify_prior_heads(workspace: Path, refs: dict[str, str]) -> None:
              """Fail unless each recorded prior checkout is that exact revision."""
              for key, relative in PRIOR_CHECKOUTS.items():
                  recorded = refs.get(key, "")
                  if not recorded:
                      continue
                  checkout = workspace / relative
                  if not checkout.is_dir():
                      raise SystemExit(f"{relative} prior checkout is missing")
                  head = subprocess.check_output(
                      ["git", "-C", str(checkout), "rev-parse", "--verify", "HEAD"],
                      text=True,
                  ).strip()
                  if head != recorded:
                      raise SystemExit(f"{relative} prior HEAD does not match the trusted base pin")


          def materialize_pre_split(source: Path, dest: Path, kind: str) -> None:
              """Copy pre-split operands. A missing file is a failed prior, not an empty pass."""
              paths = RUNTIME_RELATIVE_PATHS if kind == "runtime" else PIN_RELATIVE_PATHS
              for relative in paths:
                  src = source / relative
                  if src.is_symlink() or not src.is_file():
                      raise SystemExit(f"historical operand missing: {relative}")
                  target = dest / relative
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(src.read_bytes())


          def main(argv: list[str] | None = None) -> int:
              parser = argparse.ArgumentParser(description=__doc__)
              parser.add_argument("--base-workflow", type=Path)
              parser.add_argument("--github-output", type=Path)
              parser.add_argument("--verify-prior-heads", action="store_true")
              parser.add_argument("--workspace", type=Path)
              parser.add_argument("--docs-ref", default="")
              parser.add_argument("--eebus-ref", default="")
              parser.add_argument("--ebus-pin-ref", default="")
              parser.add_argument("--materialize-pre-split", choices=("runtime", "pin"))
              parser.add_argument("--source", type=Path)
              parser.add_argument("--dest", type=Path)
              args = parser.parse_args(argv)
              if args.base_workflow is not None:
                  if args.github_output is None:
                      raise SystemExit("--github-output is required")
                  refs = recorded_prior_refs(args.base_workflow.read_text(encoding="utf-8"))
                  with args.github_output.open("a", encoding="utf-8") as handle:
                      for key in OUTPUT_KEYS:
                          handle.write(f"{key}={refs[key]}\n")
              if args.verify_prior_heads:
                  if args.workspace is None:
                      raise SystemExit("--workspace is required")
                  verify_prior_heads(
                      args.workspace,
                      {
                          "docs_prior_ref": args.docs_ref,
                          "docs_eebus_prior_ref": args.eebus_ref,
                          "docs_ebus_pin_prior_ref": args.ebus_pin_ref,
                      },
                  )
              if args.materialize_pre_split:
                  if args.source is None or args.dest is None:
                      raise SystemExit("--source and --dest are required")
                  materialize_pre_split(args.source, args.dest, args.materialize_pre_split)
              return 0

          if __name__ == "__main__":
              sys.exit(main())
          PRIOR_OWNER_PINS
          python3 "${RUNNER_TEMP}/prior_owner_pins.py" \
            --base-workflow "${prior_workflow}" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Checkout helianthus-docs prior
        if: steps.prior_owners.outputs.docs_prior_ref != ''
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Project-Helianthus/helianthus-docs
          ref: ${{ steps.prior_owners.outputs.docs_prior_ref }}
          path: checkouts/docs-prior
          clean: true
          persist-credentials: false
      - name: Checkout helianthus-docs-eebus prior
        if: steps.prior_owners.outputs.docs_eebus_prior_ref != ''
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Project-Helianthus/helianthus-docs-eebus
          ref: ${{ steps.prior_owners.outputs.docs_eebus_prior_ref }}
          path: checkouts/docs-eebus-prior
          clean: true
          persist-credentials: false
      - name: Checkout prior pinned helianthus-docs-ebus runtime page
        if: steps.prior_owners.outputs.docs_ebus_pin_prior_ref != ''
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Project-Helianthus/helianthus-docs-ebus
          ref: ${{ steps.prior_owners.outputs.docs_ebus_pin_prior_ref }}
          path: checkouts/docs-ebus-pin-prior
          clean: true
          persist-credentials: false

      - name: Materialize trusted prior manifest
        if: github.event_name == 'pull_request'
        id: prior_manifest
        shell: bash
        env:
          TRUSTED_BASE_REF: ${{ github.event.pull_request.base.sha }}
          PRIOR_DOCS_REF: ${{ steps.prior_owners.outputs.docs_prior_ref }}
          PRIOR_EEBUS_REF: ${{ steps.prior_owners.outputs.docs_eebus_prior_ref }}
          PRIOR_EBUS_PIN_REF: ${{ steps.prior_owners.outputs.docs_ebus_pin_prior_ref }}
        run: |
          set -euo pipefail
          python3 "${RUNNER_TEMP}/prior_owner_pins.py" \
            --verify-prior-heads \
            --workspace "${GITHUB_WORKSPACE}" \
            --docs-ref "${PRIOR_DOCS_REF}" \
            --eebus-ref "${PRIOR_EEBUS_REF}" \
            --ebus-pin-ref "${PRIOR_EBUS_PIN_REF}"
          if [[ -z "${PRIOR_DOCS_REF}" ]]; then
            python3 "${RUNNER_TEMP}/prior_owner_pins.py" \
              --materialize-pre-split runtime \
              --source "${GITHUB_WORKSPACE}/checkouts/docs-ebus-base" \
              --dest "${GITHUB_WORKSPACE}/checkouts/docs-prior"
          fi
          if [[ -z "${PRIOR_EBUS_PIN_REF}" ]]; then
            python3 "${RUNNER_TEMP}/prior_owner_pins.py" \
              --materialize-pre-split pin \
              --source "${GITHUB_WORKSPACE}/checkouts/docs-ebus-base" \
              --dest "${GITHUB_WORKSPACE}/checkouts/docs-ebus-pin-prior"
          fi
          manifest_path="docs/platform/manifests/eebus-doc-ownership.yaml"
          base_root="${GITHUB_WORKSPACE}/checkouts/docs-ebus-base"
          if ! git -C "${base_root}" cat-file -e "HEAD:${manifest_path}" 2>/dev/null; then
            if [[ -z "${PRIOR_EEBUS_REF}" ]]; then
              echo "trusted prior owner pin is missing" >&2
              exit 1
            fi
            base_root="${GITHUB_WORKSPACE}/checkouts/docs-eebus-prior"
            TRUSTED_BASE_REF="${PRIOR_EEBUS_REF}"
          fi
          materialized_root="${RUNNER_TEMP}/helianthus-trusted-prior-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          materialized="${materialized_root}/eebus-doc-ownership.yaml"

          trusted_type="$(git -C "${base_root}" cat-file -t "${TRUSTED_BASE_REF}")"
          if [[ "${trusted_type}" != "commit" ]]; then
            exit 1
          fi
          trusted_commit="$(git -C "${base_root}" rev-parse --verify "${TRUSTED_BASE_REF}")"
          actual_commit="$(git -C "${base_root}" rev-parse --verify HEAD)"
          if [[ "${actual_commit}" != "${trusted_commit}" ]]; then
            exit 1
          fi

          IFS='/' read -r -a components <<< "${manifest_path}"
          prefix=""
          manifest_oid=""
          manifest_present=true
          last_index=$((${#components[@]} - 1))
          for index in "${!components[@]}"; do
            prefix="${prefix:+${prefix}/}${components[${index}]}"
            entry="$(git -C "${base_root}" ls-tree "${trusted_commit}" -- "${prefix}")"
            if [[ -z "${entry}" ]]; then
              manifest_present=false
              break
            fi
            metadata="${entry%%$'\t'*}"
            read -r mode object_type object_id <<< "${metadata}"
            if ((index < last_index)); then
              if [[ "${mode}" != "040000" || "${object_type}" != "tree" ]]; then
                exit 1
              fi
            else
              if [[ ! "${mode}" =~ ^100(644|755)$ || "${object_type}" != "blob" ]]; then
                exit 1
              fi
              manifest_oid="${object_id}"
            fi
          done

          if [[ "${manifest_present}" == "true" ]]; then
            umask 077
            mkdir -p "${materialized_root}"
            if [[ ! -d "${materialized_root}" || -L "${materialized_root}" ]]; then
              exit 1
            fi
            git -C "${base_root}" cat-file blob "${manifest_oid}" > "${materialized}"
            if [[ ! -f "${materialized}" || -L "${materialized}" ]]; then
              exit 1
            fi
            printf 'path=%s\n' "${materialized}" >> "${GITHUB_OUTPUT}"
          else
            echo "trusted prior manifest is missing" >&2
            exit 1
          fi

      - name: Set up Go (for santhosh-tekuri/jsonschema/cmd/jv)
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.22.12"

      - name: Install jv (santhosh-tekuri/jsonschema CLI)
        run: |
          go install github.com/santhosh-tekuri/jsonschema/cmd/jv@v0.7.0
          echo "${HOME}/go/bin" >> "${GITHUB_PATH}"

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      # A same-repository pull request lists the heavy suites whose inputs
      # (scripts/ci_suite_inputs.json) are byte-identical at the PR head and at
      # the trusted base. The base copy of the classifier and of its input lists
      # decides, so a pull request cannot narrow its own suites; a base without
      # the classifier, or any classifier error, lists nothing and every suite
      # runs. Fork pull requests, main pushes, the nightly schedule and manual
      # dispatches skip this step and run every suite.
      - name: Classify unchanged heavy suites
        id: suite_inputs
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euo pipefail
          base_root="${GITHUB_WORKSPACE}/checkouts/docs-ebus-base"
          head_root="${GITHUB_WORKSPACE}/checkouts/docs-ebus"
          classifier="${base_root}/scripts/ci_suite_inputs.py"
          unchanged=""
          if [[ -f "${classifier}" && ! -L "${classifier}" ]]; then
            if ! unchanged="$(python3 "${classifier}" --base "${base_root}" --head "${head_root}")"; then
              echo "::warning::Suite input classification failed; every heavy suite runs."
              unchanged=""
            fi
          else
            echo "The trusted base has no suite input classifier; every heavy suite runs."
          fi
          echo "Heavy suites with unchanged inputs: ${unchanged:-none}"
          printf 'unchanged=%s\n' "${unchanged}" >> "${GITHUB_OUTPUT}"

      - name: Run local docs CI
        env:
          PLATFORM_DOCS_EBUS_REPOSITORY: Project-Helianthus/helianthus-docs
          PLATFORM_DOCS_ROOT: ${{ github.workspace }}/checkouts/docs
          PLATFORM_DOCS_EEBUS_ROOT: ${{ github.workspace }}/checkouts/docs-eebus
          # ci_local.sh stages the pinned public Modbus companion for hosted and local runs.
          PLATFORM_DOCS_MODBUS_ROOT: ''
          PLATFORM_DOCS_PRIOR_ROOT: ${{ github.workspace }}/checkouts/docs-prior
          PLATFORM_DOCS_EEBUS_PRIOR_ROOT: ${{ github.workspace }}/checkouts/docs-eebus-prior
          PLATFORM_DOCS_EBUS_PIN_ROOT: ${{ github.workspace }}/checkouts/docs-ebus-pin
          PLATFORM_DOCS_EBUS_PIN_PRIOR_ROOT: ${{ github.workspace }}/checkouts/docs-ebus-pin-prior
          PLATFORM_TOOLCHAIN_MODE: exact
          PLATFORM_PRIOR_MANIFEST: ${{ steps.prior_manifest.outputs.path }}
          MODBUS_PRIOR_ROOT: ${{ github.event_name == 'pull_request' && format('{0}/checkouts/docs-ebus-base', github.workspace) || '' }}
          M625_TRUSTED_BASE_ROOT: ${{ github.workspace }}/checkouts/m625-trusted-base
          PLATFORM_M625_DOCS_EEBUS_ROOT: ${{ github.workspace }}/checkouts/m625-docs-eebus
          PLATFORM_M625_EXECUTION_PLANS_ROOT: ${{ github.workspace }}/checkouts/m625-execution-plans
          # Empty unless the classification step above ran for this pull request.
          CI_UNCHANGED_SUITES: ${{ steps.suite_inputs.outputs.unchanged }}
