"""The isolated public machine-to-machine V1 query surface."""
type Query {
  m2mCurrentSnapshot(request: M2MCurrentSnapshotRequest!): M2MCurrentSnapshot!
}

input M2MCurrentSnapshotRequest {
  contractId: String!
  assetRef: String!
}

type M2MCurrentSnapshot {
  contractId: String!
  canonicalContractId: String!
  assetRef: String!
  generation: String!
  producedAt: String!
  evaluatedMonotonicNs: String!
  sourceTimeState: M2MSourceTimeState!
  currentSourceOriginRef: String!
  facts: [M2MFact!]!
  capabilities: [M2MCapability!]!
  provenance: [M2MOpaqueProvenance!]!
  requestedOutputs: [M2MRequestedOutput!]!
  projectionReport: [M2MProjectionReportEntry!]!
}

type M2MFact {
  factId: String!
  dimension: M2MDimension!
  value: M2MValue!
  unit: String!
  quality: M2MQuality!
  availability: M2MAvailability!
  freshness: M2MFreshness!
  receiptMonotonicNs: String!
  freshUntilMonotonicNs: String!
  retainUntilMonotonicNs: String!
  freshnessPolicy: String!
  originRef: String!
  continuity: M2MContinuity
}

union M2MDimension = M2MScopeDimension | M2MPhaseDimension | M2MPhasePairDimension | M2MInputDimension | M2MSensorDimension
type M2MScopeDimension { scope: String! }
type M2MPhaseDimension { phase: String! }
type M2MPhasePairDimension { phasePair: String! }
type M2MInputDimension { inputId: String! }
type M2MSensorDimension { sensorId: String! }
union M2MValue = M2MDecimalValue | M2MEnumValue | M2MBitfieldValue
type M2MDecimalValue { coefficient: String!, scale: Int! }
type M2MEnumValue { symbol: String! }
type M2MBitfieldValue { symbols: [String!]! }
union M2MContinuity = M2MBaselineContinuity | M2MContiguousContinuity | M2MRolloverContinuity | M2MResetContinuity | M2MDiscontinuityContinuity
type M2MBaselineContinuity { state: M2MContinuityState! }
type M2MContiguousContinuity { state: M2MContinuityState!, delta: M2MDecimalValue! }
type M2MRolloverContinuity { state: M2MContinuityState!, delta: M2MDecimalValue!, modulus: M2MDecimalValue!, evidenceRef: String }
type M2MResetContinuity { state: M2MContinuityState!, evidenceRef: String }
type M2MDiscontinuityContinuity { state: M2MContinuityState!, evidenceRef: String }
type M2MCapability { id: String!, outcome: M2MCapabilityOutcome! }
type M2MRequestedOutput { sourceRef: String!, requestedOutputRef: String! }
type M2MProjectionReportEntry {
  sourceRef: String!
  requestedOutputRef: String!
  factId: String
  dimension: M2MDimension
  outcome: M2MProjectionOutcome!
}
type M2MOpaqueProvenance {
  originRef: String!
  sourceProtocol: String!
  sourceProfileId: String!
  sourceProfileVersion: String!
  sourceValidity: String!
  sourceRegistryRef: String!
  sourceObservationRef: String!
  evidenceRef: String!
}

enum M2MQuality { GOOD SUSPECT BAD }
enum M2MAvailability { AVAILABLE UNAVAILABLE UNSUPPORTED }
enum M2MFreshness { FRESH STALE EXPIRED }
enum M2MSourceTimeState { UNAVAILABLE VALID INVALID }
enum M2MContinuityState { BASELINE CONTIGUOUS ROLLOVER RESET DISCONTINUITY }
enum M2MCapabilityOutcome { SATISFIED NOT_SATISFIED }
enum M2MProjectionOutcome { MAPPED WITHHELD UNREPRESENTABLE }
